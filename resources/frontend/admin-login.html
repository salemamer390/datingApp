<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="LoveConnect administration sign in"><title>Administration Sign In | LoveConnect</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><script src="js/theme-init.js"></script>
<link href="css/style.css" rel="stylesheet"><style>
.admin-login-wrap{min-height:100vh;display:flex;flex-direction:column}
.admin-login-main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.admin-login-card{width:100%;max-width:420px;background:var(--bs-body-bg);border:1px solid var(--bs-border-color);border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(25,20,39,.08)}
.admin-login-error{display:none;background:#fde8ef;color:#a31245;border-radius:12px;padding:10px 14px;font-size:.9rem;margin-bottom:16px}
</style></head><body data-no-translate><div class="admin-login-wrap">
<nav class="navbar navbar-dark site-nav"><div class="container-fluid px-lg-4 px-3"><a class="navbar-brand d-flex align-items-center gap-2" href="admin-login.html" aria-label="LoveConnect administration"><span class="brand-mark"><i class="bi bi-heart-fill"></i></span><span>LoveConnect</span></a><span class="badge text-bg-light rounded-pill">Administration</span></div></nav>
<main class="admin-login-main section-soft"><div class="admin-login-card">
<h1 class="h3 mb-1">Administration</h1>
<p class="text-muted mb-4">Sign in with the site owner account to open the dashboard. This area is separate from the member site.</p>
<div class="admin-login-error" id="adminLoginError" role="alert"></div>
<form id="adminLoginForm" novalidate>
<div class="mb-3"><label class="form-label fw-semibold" for="adminLoginEmail">Email</label><input class="form-control" id="adminLoginEmail" type="email" autocomplete="username" required></div>
<div class="mb-4"><label class="form-label fw-semibold" for="adminLoginPassword">Password</label><input class="form-control" id="adminLoginPassword" type="password" autocomplete="current-password" required></div>
<button class="btn btn-pink w-100 rounded-pill" type="submit" id="adminLoginBtn">Sign in to dashboard</button>
</form>
<p class="small text-muted mt-4 mb-0">Not the site owner? <a href="index.html">Back to LoveConnect</a></p>
</div></main>
<footer class="site-footer"><div class="container d-flex align-items-center justify-content-center"><p class="mb-0">© <span id="year"></span> LoveConnect. Administration area.</p></div></footer>
</div><script>
document.getElementById('year').textContent = new Date().getFullYear();
(function () {
  if (window.LC && LC.me && LC.me.is_admin) { location.replace('admin.html'); return; }
  var form = document.getElementById('adminLoginForm');
  var err = document.getElementById('adminLoginError');
  var btn = document.getElementById('adminLoginBtn');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    fetch('api/admin-login', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', 'X-CSRF-TOKEN': (window.LC && LC.csrf) || '' },
      credentials: 'same-origin',
      body: JSON.stringify({ email: document.getElementById('adminLoginEmail').value, password: document.getElementById('adminLoginPassword').value })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.ok && j.redirect) { location.href = String(j.redirect).replace(/^\//, ''); return; }
        var msg = j.message || 'Something went wrong. Please try again.';
        err.textContent = msg;
        err.style.display = 'block';
        btn.disabled = false;
        if (r.status === 419 || r.status === 403) { setTimeout(function () { location.reload(); }, 2500); }
      });
    }).catch(function () {
      err.textContent = 'Network error. Please try again.';
      err.style.display = 'block';
      btn.disabled = false;
    });
  });
})();
</script></body></html>
