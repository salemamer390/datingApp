<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="LoveConnect account settings"><title>Preferences | LoveConnect</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><script src="js/theme-init.js"></script>
<link href="css/style.css" rel="stylesheet"></head><body><script src="js/layout.js" data-part="nav"></script><main><section class="section-pad section-soft"><div class="container settings-layout"><aside class="settings-sidebar"><h1 class="h3 mb-4">Settings</h1><nav class="settings-nav"><a class="" href="settings.html"><i class="bi bi-person"></i>Account</a><a class="" href="settings-profile.html"><i class="bi bi-person-vcard"></i>Profile</a><a class="" href="settings-photos.html"><i class="bi bi-images"></i>Photos</a><a class="" href="settings-privacy.html"><i class="bi bi-lock"></i>Privacy</a><a class="" href="settings-notifications.html"><i class="bi bi-bell"></i>Notifications</a><a class="active" href="settings-preferences.html"><i class="bi bi-sliders"></i>Preferences</a><a class="" href="settings-blocked.html"><i class="bi bi-slash-circle"></i>Blocked Users</a></nav></aside><section class="settings-panel"><h1 class="h3 mb-1">Preferences</h1><p class="text-muted mb-4">Set your dating and discovery preferences</p><div class="settings-fields"><div class="settings-field"><label for="lookingFor">I’m looking for</label><select class="form-select" id="lookingFor"><option>A serious relationship</option><option>Friendship</option><option>Casual dating</option><option>Still figuring it out</option></select></div><div class="settings-field"><label>Show me</label><div class="d-flex gap-4 flex-wrap"><label><input type="radio" name="prefGender" value="Men"> Men</label><label><input type="radio" name="prefGender" value="Women" checked> Women</label><label><input type="radio" name="prefGender" value="Everyone"> Everyone</label></div></div><div class="settings-field"><label for="ageRange">Age range</label><div><input class="form-range" type="range" id="ageRange" min="18" max="70" value="35"><div class="small text-muted">Up to <span id="ageRangeValue">35</span> years</div></div></div><div class="settings-field"><label for="distanceRange">Distance</label><div><input class="form-range" type="range" id="distanceRange" min="5" max="500" value="100"><div class="small text-muted">Within <span id="distanceValue">100</span> km</div></div></div><div class="settings-field"><label for="prefInterests">Interests</label><input class="form-control" id="prefInterests" placeholder="Music, travel, fitness"></div></div><div class="d-flex justify-content-end mt-4"><button class="btn btn-pink rounded-pill" type="button" data-local-save>Save Changes</button></div></section></div></section></main><script src="js/layout.js" data-part="footer"></script><div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content auth-modal"><div class="modal-header"><h2 class="modal-title fs-5">Log In</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="loginForm"><input class="form-control mb-3" type="email" placeholder="Email" required><input class="form-control mb-3" type="password" placeholder="Password" required><button class="btn btn-pink w-100" type="submit">Log In</button></form></div></div></div></div><div class="modal fade" id="signupModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content auth-modal"><div class="modal-header"><h2 class="modal-title fs-5">Create account</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="signupForm"><input class="form-control mb-3" placeholder="Name" required><input class="form-control mb-3" type="email" placeholder="Email" required><input class="form-control mb-3" type="password" placeholder="Password" required><button class="btn btn-pink w-100" type="submit">Sign Up</button></form></div></div></div></div><div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="siteToast" class="toast align-items-center border-0" role="status"><div class="d-flex"><div class="toast-body" id="toastMessage">Saved</div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script src="js/settings-pages.js"></script></body></html>
