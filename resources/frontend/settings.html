<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="LoveConnect account settings"><title>Account Settings | LoveConnect</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><script src="js/theme-init.js"></script>
<link href="css/style.css" rel="stylesheet"></head><body><script src="js/layout.js" data-part="nav"></script><main><section class="section-pad section-soft"><div class="container settings-layout"><aside class="settings-sidebar"><h1 class="h3 mb-4">Settings</h1><nav class="settings-nav"><a class="active" href="settings.html"><i class="bi bi-person"></i>Account</a><a class="" href="settings-profile.html"><i class="bi bi-person-vcard"></i>Profile</a><a class="" href="settings-photos.html"><i class="bi bi-images"></i>Photos</a><a class="" href="settings-privacy.html"><i class="bi bi-lock"></i>Privacy</a><a class="" href="settings-notifications.html"><i class="bi bi-bell"></i>Notifications</a><a class="" href="settings-preferences.html"><i class="bi bi-sliders"></i>Preferences</a><a class="" href="settings-blocked.html"><i class="bi bi-slash-circle"></i>Blocked Users</a><a class="danger" href="#delete-account" id="deleteAccountLink"><i class="bi bi-trash"></i>Delete Account</a></nav></aside><section class="settings-panel"><h1 class="h3 mb-1">Account Settings</h1><p class="text-muted mb-4">Manage your account and login details</p><form id="settingsAccountForm"><div class="settings-user-row"><div class="settings-user-avatar" id="settingsAvatar">U</div><div class="flex-grow-1"><h2 class="h4 mb-1" id="settingsName">Your profile</h2><p class="text-muted mb-0">LoveConnect member</p></div><label class="btn btn-outline-pink rounded-pill mb-0" for="accountPhotoUpload"><i class="bi bi-camera me-2"></i>Change Photo</label><input type="file" id="accountPhotoUpload" class="d-none" accept="image/*"></div><div class="settings-fields"><div class="settings-field"><i class="bi bi-envelope"></i><label for="settingEmail">Email</label><input id="settingEmail" class="form-control" type="email" placeholder="you@example.com"></div><div class="settings-field"><i class="bi bi-lock"></i><label for="settingPassword">Password</label><input id="settingPassword" class="form-control" type="password" placeholder="Enter a new password"></div><div class="settings-field"><i class="bi bi-telephone"></i><label for="settingPhone">Phone</label><input id="settingPhone" class="form-control" type="tel" placeholder="Add phone number"></div><div class="settings-field"><i class="bi bi-translate"></i><label for="settingLanguage">Language</label><select id="settingLanguage" class="form-select"><option>English</option><option>العربية</option><option>Français</option></select></div><div class="settings-field"><i class="bi bi-palette"></i><label>Theme</label><div class="theme-options"><button type="button" class="theme-option" data-set-theme="classic">Classic</button><button type="button" class="theme-option" data-set-theme="hinge">Hinge (B&amp;W)</button><button type="button" id="settingsNightToggle" class="theme-option">Night Mode</button></div></div><div class="d-flex justify-content-end mt-4"><button class="btn btn-pink rounded-pill px-4" type="submit">Save Changes</button></div></form></section></div></section></main><script src="js/layout.js" data-part="footer"></script><div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content auth-modal"><div class="modal-header"><h2 class="modal-title fs-5">Log In</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="loginForm"><input class="form-control mb-3" type="email" placeholder="Email" required><input class="form-control mb-3" type="password" placeholder="Password" required><button class="btn btn-pink w-100" type="submit">Log In</button></form></div></div></div></div><div class="modal fade" id="signupModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content auth-modal"><div class="modal-header"><h2 class="modal-title fs-5">Create account</h2><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="signupForm"><input class="form-control mb-3" placeholder="Name" required><input class="form-control mb-3" type="email" placeholder="Email" required><input class="form-control mb-3" type="password" placeholder="Password" required><button class="btn btn-pink w-100" type="submit">Sign Up</button></form></div></div></div></div><div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="siteToast" class="toast align-items-center border-0" role="status"><div class="d-flex"><div class="toast-body" id="toastMessage">Saved</div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script src="js/settings-pages.js"></script></body></html>
