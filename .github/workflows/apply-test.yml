name: apply-test
on:
  push:
    paths:
      - .github/workflows/apply-test.yml
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lc
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, gd
      - run: echo '' | base64 -d | gunzip | git apply --index
      - run: composer install --no-interaction --prefer-dist
      - name: tests sqlite
        run: php artisan test
      - name: tests mysql
        run: DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=lc DB_USERNAME=root DB_PASSWORD=root php artisan test
      - name: commit
        run: |
          git config user.name "LoveConnect Test Build"
          git config user.email "noreply@users.noreply.github.com"
          git commit -m "Prepare limited InfinityFree test build: 30s visible-tab chat refresh, MySQL env example, notes"
          git push origin HEAD:main
