name: import-source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded source archive
        run: |
          P=$(ls | grep 'payload\.tar\.gz$' | head -1 || true)
          if [ -z "$P" ]; then echo "no payload, nothing to do"; exit 0; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name "$P" -exec rm -rf {} +
          tar xzf "$P"
          rm -f "$P"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import LoveConnect Laravel backend source" || exit 0
          git push
